# Konfigurasi Nginx untuk Domain: mf035.my.id
# Lokasi di VPS: /etc/nginx/sites-available/mf035.my.id

server {
    listen 80;
    listen [::]:80;
    server_name mf035.my.id www.mf035.my.id;

    # Batas ukuran upload file (disesuaikan dengan upload PDF/Excel/DWG di aplikasi)
    client_max_body_size 100M;

    # Proxy ke Node.js Express Applet di Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout handling untuk upload file besar
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
